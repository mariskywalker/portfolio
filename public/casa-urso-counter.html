<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa do Urso, Counter</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  @font-face{
    font-family:"Dolpino";
    src:url("https://db.onlinewebfonts.com/t/eb24225f7e3878afacc92b4efe6ca38e.eot");
    src:url("https://db.onlinewebfonts.com/t/eb24225f7e3878afacc92b4efe6ca38e.eot?#iefix") format("embedded-opentype"),
      url("https://db.onlinewebfonts.com/t/eb24225f7e3878afacc92b4efe6ca38e.woff2") format("woff2"),
      url("https://db.onlinewebfonts.com/t/eb24225f7e3878afacc92b4efe6ca38e.woff") format("woff"),
      url("https://db.onlinewebfonts.com/t/eb24225f7e3878afacc92b4efe6ca38e.ttf") format("truetype");
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #e8e0d8 0%, #ddd5cc 30%, #cfd8dc 70%, #d4cfe0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .blob-pink {
    position: fixed;
    width: 260px; height: 160px;
    background: rgba(230, 110, 90, .45);
    border-radius: 50%;
    bottom: 40px; left: -40px;
    filter: blur(50px);
    pointer-events: none;
  }
  .blob-blue {
    position: fixed;
    width: 280px; height: 200px;
    background: rgba(175, 185, 228, .38);
    border-radius: 50%;
    top: 20px; right: -20px;
    filter: blur(55px);
    pointer-events: none;
  }

  .card {
    width: 420px;
    background: rgba(255, 255, 255, .62);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, .9);
    border-radius: 24px;
    padding: 40px 40px 36px;
    box-shadow: 0 8px 40px rgba(0,0,0,.10), 0 1px 0 rgba(255,255,255,.8) inset;
    position: relative;
    z-index: 2;
    text-align: center;
  }

  .bear-badge {
    width: 56px; height: 56px;
    background: rgba(255, 255, 255, .8);
    border: 1px solid rgba(255, 255, 255, .95);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(93, 193, 152, .18);
    border: 1px solid rgba(93, 193, 152, .35);
    border-radius: 100px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 600;
    color: #2a8a62;
    margin-bottom: 20px;
  }
  .pill-dot { width: 7px; height: 7px; border-radius: 50%; background: #5DC198; }

  .counter-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 4px;
    margin-bottom: 10px;
  }
  .counter-num {
    font-family: "Dolpino","Poppins",system-ui,sans-serif;
    font-size: 72px;
    font-weight: 800;
    color: #111;
    letter-spacing: -3px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .counter-plus {
    font-family: "Dolpino","Poppins",system-ui,sans-serif;
    font-size: 40px;
    font-weight: 700;
    color: #111;
  }

  .counter-label {
    font-size: 15px;
    color: #555;
    line-height: 1.5;
    margin-bottom: 28px;
  }
  .counter-label strong { font-weight: 600; color: #111; }

  .divider { height: 1px; background: rgba(0,0,0,.07); margin-bottom: 24px; }

  .stats-row { display: flex; justify-content: center; }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex: 1;
    padding: 0 8px;
  }
  .stat + .stat { border-left: 1px solid rgba(0,0,0,.07); }
  .stat-val {
    font-size: 20px;
    font-weight: 700;
    color: #111;
    letter-spacing: -.5px;
    font-variant-numeric: tabular-nums;
  }
  .stat-label { font-size: 11px; color: #888; line-height: 1.4; text-align: center; }

  /* Floating icons */
  .icon-asterisk {
    position: absolute;
    top: -40px; left: -36px;
    width: 120px; height: 120px;
    filter: drop-shadow(0 10px 22px rgba(245,191,66,.38));
    pointer-events: none;
    z-index: 10;
    transition: transform .5s cubic-bezier(.34,1.56,.64,1), filter .4s;
  }
  .card:hover .icon-asterisk {
    transform: translateY(-10px) rotate(15deg) scale(1.08);
    filter: drop-shadow(0 18px 36px rgba(245,191,66,.6));
  }

  .icon-heart {
    position: absolute;
    bottom: -28px; right: -32px;
    width: 120px; height: 100px;
    filter: drop-shadow(0 8px 20px rgba(249,116,110,.4));
    pointer-events: none;
    z-index: 10;
    transition: transform .5s cubic-bezier(.34,1.56,.64,1), filter .4s;
  }
  .card:hover .icon-heart {
    transform: translateY(-10px) rotate(-10deg) scale(1.08);
    filter: drop-shadow(0 16px 32px rgba(249,116,110,.6));
  }
</style>
</head>

<script>
  function easeOutExpo(t) {
    return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
  }

  function animateCount(el, target, duration, format) {
    const start = performance.now();
    function step(now) {
      const p = Math.min((now - start) / duration, 1);
      const v = easeOutExpo(p) * target;
      el.textContent = format(v);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  const observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting) {
      animateCount(document.getElementById('counter'),     1200, 2200, v => Math.round(v).toLocaleString('en-US'));
      animateCount(document.getElementById('s-followers'), 6161, 1800, v => Math.round(v).toLocaleString('en-US'));
      animateCount(document.getElementById('s-views'),      2.5, 2000, v => v.toFixed(1) + 'M');
      observer.disconnect();
    }
  }, { threshold: 0.4 });

  observer.observe(document.getElementById('counter'));
</script>
